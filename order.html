<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>สั่งซื้อ | Daily Bake</title>
<link rel="stylesheet" href="style.css" />
<style>
  .order-wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: var(--space-2xl) var(--space-md);
  }

  .order-header {
    text-align: center;
    margin-bottom: var(--space-lg);
  }

  #orderForm {
    background-color: var(--color-white);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-lg);
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .form-group label {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--color-brown-deep);
  }

  .form-group input,
  .form-group textarea {
    padding: 0.75rem 1rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.95rem;
    background-color: var(--color-cream-soft);
    color: var(--color-brown-text);
  }

  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--color-brown-warm);
    background-color: var(--color-white);
  }

  .form-group input[readonly] {
    color: var(--color-brown-muted);
    cursor: not-allowed;
  }

  textarea {
    resize: vertical;
    min-height: 90px;
  }

  .submit-btn {
    width: 100%;
    margin-top: var(--space-xs);
  }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Daily Bake</a>
      <div class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
        <a href="order.html">สั่งซื้อ</a>
      </div>
    </div>
  </nav>

  <div class="order-wrap">
    <div class="order-header">
      <span class="eyebrow">Checkout</span>
      <h1>ยืนยันคำสั่งซื้อ</h1>
      <p>กรอกข้อมูลให้ครบเพื่อให้เราติดต่อกลับได้ถูกต้อง</p>
    </div>

    <form id="orderForm">
      <div class="form-group">
        <label for="customerName">ชื่อผู้สั่งซื้อ</label>
        <input type="text" id="customerName" name="customerName" placeholder="ชื่อ-นามสกุล" required />
      </div>

      <div class="form-group">
        <label for="contact">เบอร์โทร / Line ID</label>
        <input type="text" id="contact" name="contact" placeholder="เบอร์โทรศัพท์หรือ Line ID" required />
      </div>

      <div class="form-group">
        <label for="items">รายการสินค้า</label>
        <input type="text" id="items" name="items" readonly />
      </div>

      <div class="form-group">
        <label for="total">ยอดรวม (บาท)</label>
        <input type="text" id="total" name="total" readonly />
      </div>

      <div class="form-group">
        <label for="note">หมายเหตุ (ถ้ามี)</label>
        <textarea id="note" name="note" placeholder="เช่น ที่อยู่จัดส่ง, เวลาที่สะดวกรับสินค้า"></textarea>
      </div>

      <button type="submit" class="btn btn-primary submit-btn">ยืนยันสั่งซื้อ</button>
    </form>
  </div>

  <script src="script.js"></script>

</body>
</html>
